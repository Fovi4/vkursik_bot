services:
  - type: worker
    name: vkursik-bot
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DB_PATH
        value: /var/data/applications.db
    disk:
      name: vkursik-data
      mountPath: /var/data
      sizeGB: 1
